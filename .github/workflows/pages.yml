name: Build and deploy project site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    env:
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: "no"
      PLATFORMIO_SETTING_CHECK_PLATFORMIO_INTERVAL: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python -m pip install -r tools/requirements-media.txt platformio==6.1.19

      - name: Build Cardputer ADV application
        run: pio run -d firmware -e lofi-adv -j 2

      - name: Build and check shared native code
        run: |
          cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DLOFI_M5GFX_SOURCE_DIR="$GITHUB_WORKSPACE/firmware/.pio/libdeps/lofi-adv/M5GFX"
          cmake --build build/cmake --parallel 2
          ctest --test-dir build/cmake --output-on-failure
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Render screenshots, animation and audio
        run: |
          ./build/cmake/lofi_native --shots build/screens --animation build/animation --frames 144
          python tools/export_media.py
          python tools/render_audio.py --seconds 180

      - name: Package firmware and build public site
        run: |
          python tools/build_release.py
          python tools/build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
